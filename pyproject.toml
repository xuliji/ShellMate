[project]
name = "shellmate-ai"
version = "0.1.1"
description = "An AI assistant for your zsh command line"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "langchain-openai>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
]

[project.scripts]
shellmate-ai = "shellmate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shellmate = ["*.zsh"]
